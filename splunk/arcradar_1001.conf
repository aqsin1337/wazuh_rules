# ArcRadar rule 1001 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1001]
description = Multiple Failed Logons from Same Source
search = index=main sourcetype=WinEventLog:Security | regex EventCode="(?i)^4625$" | regex Keywords="(?i)Audit Failure"
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
