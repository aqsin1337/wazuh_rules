# ArcRadar rule 1004 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1004]
description = Kerberoasting Service Ticket Request Detection
search = index=main sourcetype=WinEventLog:Security | regex Message="(?i)Kerberos"
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
