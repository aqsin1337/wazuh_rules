# ArcRadar rule 1002 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1002]
description = Potential SQL Service Execution
search = index=main sourcetype=WinEventLog:Security | regex Process_Name="(?i)sql"
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
alert.digest_mode = 0
