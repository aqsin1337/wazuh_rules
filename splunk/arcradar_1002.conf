# ArcRadar rule 1002. Generated by ArcRadar: change it there, not in this file.
[arcradar_1002]
description = Potential SQL Service Execution
search = index=main sourcetype=WinEventLog:Security | regex Process_Name="(?i)sql"
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
alert.digest_mode = 0
action.arcradar_forward = 1
action.arcradar_forward.param.rule_key = 1002
action.arcradar_forward.param.name = Potential SQL Service Execution
action.arcradar_forward.param.severity = medium
action.arcradar_forward.param.mitre = T1190
