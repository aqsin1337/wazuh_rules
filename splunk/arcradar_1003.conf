# ArcRadar rule 1003 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1003]
description = Impossible Travel Login Detection
search = index=main sourcetype=WinEventLog:Security | regex EventCode="(?i)^4624$" | stats count by Account_Name | where count >= 2
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -60m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 60m
alert.suppress.fields = Account_Name
