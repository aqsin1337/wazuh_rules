# ArcRadar rule 1005 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1005]
description = Golden Ticket Use Detected
search = index=main sourcetype=WinEventLog:Security | regex EventCode="(?i)^4624$" | regex Account_Name="(?i)krbtgt" | regex Logon_Type="(?i)^2$"
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
