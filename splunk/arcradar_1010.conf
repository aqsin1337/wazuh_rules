# ArcRadar rule 1010 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1010]
description = SMBExec Remote Command Execution Detection
search = index=main sourcetype=WinEventLog:Security | regex EventCode="(?i)^5156$" | regex Destination_Port="(?i)^445$" | regex Protocol="(?i)^6$" | regex Direction="(?i)^Inbound$"
enableSched = 0
cron_schedule = * * * * *
dispatch.earliest_time = rt
dispatch.latest_time = rt
alert_type = always
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
