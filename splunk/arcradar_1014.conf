# ArcRadar rule 1014 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1014]
description = SMBexec Remote Command Execution Detection
search = index=main sourcetype=WinEventLog:Security | regex Process_Name="(?i)smbexec"
enableSched = 0
cron_schedule = * * * * *
dispatch.earliest_time = rt
dispatch.latest_time = rt
alert_type = always
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
