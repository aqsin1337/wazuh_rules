# ArcRadar rule 1008 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1008]
description = Detect Service Install with COMSPEC Echo
search = index=main | regex EventCode="(?i)^7045$" | regex Message="(?i)%COMSPEC% \\/Q \\/c echo"
enableSched = 0
cron_schedule = * * * * *
dispatch.earliest_time = rt
dispatch.latest_time = rt
alert_type = always
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
