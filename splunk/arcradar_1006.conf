# ArcRadar rule 1006 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1006]
description = Multiple ports from same source within 1 minute
search = index=main sourcetype=WinEventLog:Security | regex EventCode="(?i)^5156$" | stats count by Source_Address | where count >= 10
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 1m
alert.suppress.fields = Source_Address
