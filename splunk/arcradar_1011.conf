# ArcRadar rule 1011 (test mode: not scheduled, no action). Generated by ArcRadar: change it there, not in this file.
[arcradar_1011]
description = SMBexec Remote Command Execution Detection
search = index=main sourcetype=WinEventLog:Security | regex Destination_Port="(?i)^445$"
enableSched = 0
cron_schedule = * * * * *
dispatch.earliest_time = rt
dispatch.latest_time = rt
alert_type = always
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
